server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: pet-adopt
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # characterEncoding 只能是 Java 字符集名，utf8mb4 不是合法字符集；
    # MySQL 8/9 服务端默认 utf8mb4，写 UTF-8 即可满足中文与 emoji 存储。
    url: jdbc:mysql://localhost:3306/pet_adopt?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:1234}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

logging:
  level:
    com.pet.adopt: debug

pet:
  jwt:
    # 签名密钥，生产环境请用环境变量 JWT_SECRET 覆盖，长度不得少于 32 字节
    secret: ${JWT_SECRET:pet-adopt-jwt-secret-key-2026-change-me-in-production}
    # 令牌有效期（小时）
    expire-hours: 2
